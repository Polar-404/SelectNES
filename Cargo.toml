[package]
name = "nes_emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25.10"
lazy_static = "1.4.0"
arboard = "3.4.0"
cpal = "0.15"
ringbuf = "0.4.8"
sysinfo = "0.30"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.16"
egui = "0.31"
egui_glow = { version = "0.31", features = ["winit"] }
egui_dock = "0.16"
serde = { version = "1.0.228", features = ["derive"] }
rfd = "0.17.2"
serde_json = "1.0.149"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[build-dependencies]
winres = "0.1"

[dependencies.bitflags]
version = "2.9.1"

[profile.dev]
opt-level = 1 #so it runs at 60fps on debug mode
debug-assertions = true 

[profile.release]
lto = "fat"
strip = true
opt-level = 3

[features]
debug_log = []
